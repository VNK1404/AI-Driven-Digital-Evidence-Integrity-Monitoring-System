{% extends 'base.html' %}
{% load static %}

{% block title %}DeepShield — Error{% endblock %}

{% block content %}
<div class="error-page">
  <div class="error-icon">⚠️</div>
  <h1 class="error-title">{{ error_title }}</h1>
  <p class="error-message">{{ error_message }}</p>
  {% if error_hint %}
    <div class="alert alert-info">💡 {{ error_hint }}</div>
  {% endif %}
  <div class="result-actions">
    <a href="{% url 'ml_app:home' %}" class="btn-primary">← Go Back</a>
  </div>
</div>
{% endblock %}
